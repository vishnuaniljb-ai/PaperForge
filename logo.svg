<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pfFlameGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="50%" stop-color="#FF3E24" />
      <stop offset="100%" stop-color="#C22000" />
    </linearGradient>
    <linearGradient id="pfCyanLaser" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="pfPlateDark" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242B3B" />
      <stop offset="100%" stop-color="#0F131C" />
    </linearGradient>
    <filter id="pfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#pfPlateDark)" stroke="#3A4660" stroke-width="8" />

  <!-- Grid Lines -->
  <path d="M120 80 L392 80 M80 256 L432 256 M120 432 L392 432" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <path d="M256 80 L256 432" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />

  <!-- Glowing Core Aura -->
  <circle cx="256" cy="256" r="100" fill="#FF5533" fill-opacity="0.2" filter="url(#pfGlow)" />

  <!-- Origami Left Paper Sheet -->
  <path d="M140 120 L270 90 L240 270 L110 230 Z" fill="#E2E8F0" fill-opacity="0.95" />
  <path d="M140 120 L240 270 L110 230 Z" fill="#94A3B8" fill-opacity="0.4" />

  <!-- Origami Right Flame Sheet -->
  <path d="M270 90 L390 150 L340 330 L240 270 Z" fill="url(#pfFlameGrad)" />
  <path d="M270 90 L340 330 L240 270 Z" fill="#B91C1C" fill-opacity="0.4" />

  <!-- Anvil Precision Laser Core -->
  <path d="M160 310 L256 410 L352 310 L280 290 L256 320 L232 290 Z" fill="url(#pfCyanLaser)" filter="url(#pfGlow)" />
  <path d="M200 300 L256 375 L312 300 Z" fill="#001833" />

  <!-- Center Laser Spark -->
  <polygon points="256,180 268,230 318,242 268,254 256,304 244,254 194,242 244,230" fill="#FFFFFF" filter="url(#pfGlow)" />
</svg>
